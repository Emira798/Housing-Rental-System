name: CI Pipeline

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    # ✅ 新增：统一指定后端工作目录，所有步骤自动在springboot下执行
    working-directory: ./springboot

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: housing_rental_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          # ❌ 移除：setup-java的cache默认在根目录找pom.xml，和我们的子目录结构不兼容
          # cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          # ✅ 修正：明确指定springboot下的pom.xml作为缓存key
          key: ${{ runner.os }}-m2-${{ hashFiles('../springboot/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and compile backend
        run: mvn clean compile

      - name: Run backend tests
        run: mvn test -Dspring.profiles.active=test

      - name: Package backend
        run: mvn package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app
          path: ./target/*.jar

  frontend-build:
    runs-on: ubuntu-latest
    # ✅ 新增：统一指定前端工作目录，所有步骤自动在vue3下执行
    working-directory: ./vue3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          # ✅ 保留你原有的正确配置
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue3-app
          path: ./dist

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'library'

  deploy-artifacts:
    needs: [backend-build, frontend-build, security-scan]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Download artifacts
        # ✅ 统一版本：和upload-artifact保持一致为v4
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifacts
        run: |
          echo "Available artifacts for deployment:"
          ls -la ./artifacts/
          echo "Spring Boot JAR:"
          ls -la ./artifacts/springboot-app/
          echo "Vue3 dist:"
          ls -la ./artifacts/vue3-app/

      - name: Notify deployment ready
        run: echo "🚀 Artifacts ready for deployment to Tencent Cloud"

  notify:
    needs: [backend-build, frontend-build, security-scan, deploy-artifacts]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: success()
        run: echo "✅ CI pipeline completed successfully - Ready for deployment"

      - name: Notify on failure
        if: failure()
        run: echo "❌ CI pipeline failed. Please check the logs."