name: CI Pipeline 1

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: housing_rental_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: springboot/pom.xml

      - name: Build and compile backend
        run: mvn -f springboot/pom.xml clean compile

      - name: Run backend tests
        run: mvn -f springboot/pom.xml test -Dspring.profiles.active=test

      - name: Package backend
        run: mvn -f springboot/pom.xml package -DskipTests

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app
          path: springboot/target/*.jar

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: vue3/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix vue3

      - name: Lint frontend
        run: npm run lint --prefix vue3

      - name: Build frontend
        run: npm run build --prefix vue3

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue3-app
          path: vue3/dist

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'library'

  deploy-artifacts:
    needs: [backend-build, frontend-build, security-scan]
    runs-on: ubuntu-latest
    if: success() && github.ref == 'refs/heads/main'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Display artifacts
        run: |
          echo "Available artifacts for deployment:"
          ls -la ./artifacts/
          echo "Spring Boot JAR:"
          ls -la ./artifacts/springboot-app/
          echo "Vue3 dist:"
          ls -la ./artifacts/vue3-app/

      - name: Notify deployment ready
        run: echo "🚀 Artifacts ready for deployment to Tencent Cloud"

  notify:
    needs: [backend-build, frontend-build, security-scan, deploy-artifacts]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify on success
        if: success()
        run: echo "✅ CI pipeline completed successfully - Ready for deployment"

      - name: Notify on failure
        if: failure()
        run: echo "❌ CI pipeline failed. Please check the logs."111