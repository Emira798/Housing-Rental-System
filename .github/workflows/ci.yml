name: Simple CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-structure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'  # 检出子模块

    - name: Show directory structure
      run: |
        echo "Workspace: ${{ github.workspace }}"
        echo "Current dir: $(pwd)"
        echo "Directory contents:"
        ls -la
        echo ""
        echo "Springboot directory:"
        ls -la springboot/ || echo "springboot not found"
        echo ""
        echo "Vue3 directory:"
        ls -la vue3/ || echo "vue3 not found"
        echo ""
        echo "Springboot pom.xml:"
        ls -la springboot/pom.xml || echo "pom.xml not found"
        echo ""
        echo "Vue3 package.json:"
        ls -la vue3/package.json || echo "package.json not found"

    - name: Test Maven build
      run: |
        echo "Testing Maven build..."
        cd springboot
        mvn clean compile

    - name: Test Node build
      run: |
        echo "Testing Node build..."
        cd vue3
        npm ci
        npm run build